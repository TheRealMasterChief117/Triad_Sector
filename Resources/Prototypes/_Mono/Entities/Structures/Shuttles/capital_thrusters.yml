- type: entity
  parent: [BaseThruster, ConstructibleMachine]
  id: ThrusterLarge
  name: large thruster
  placement:
    mode: AlignTileAny
  components:
  - type: Machine
    board: LargeThrusterMachineCircuitboard
  - type: Construction
    graph: Machine2x2
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 4500
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:ChangeConstructionNodeBehavior
          node: machineFrame
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-1.45,1.45,0.45"
        density: 1750
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 10000
  - type: Thruster
    thrust: 800
    baseThrust: 800
    # Triad Start
    burnShape: ["-0.2,0.5","0.2,6.0","0.8,6.0","1.2,0.5"]
    damage:
      types:
        Heat: 360
      requiredRayQuality: 5 # You need 5 'ray points' for the thruster to work.
      blockCheckRays: # Every angle the raycasts check to see if the thruster is blocked
      # Thruster facing direction
      - angle: 0
        offset: 0, 1
        quality: 2

      - angle: 0
        offset: 1, 1
        quality: 2

      # just far enough left or right to see past a 3 deep hole at an angle
      - angle: 16
        offset: 0.25, 0.45
        quality: 1
      - angle: -16
        offset: 0.25, 0.45
        quality: 1

      # just far enough left or right to see past a 2 deep hole at an angle
      - angle: 25
        offset: 0.5, 0.45
        quality: 1
      - angle: -25
        offset: 0.5, 0.45
        quality: 1

      # 45s left and right of center
      - angle: 45
        offset: 0.5, 1
        quality: 3
      - angle: -45
        offset: 0.5, 1
        quality: 3

      # directly left and right
      - angle: 90
        offset: 1, 0
        quality: 2
      - angle: 90
        offset: 1, 1
        quality: 2
      - angle: -90
        quality: 2
      - angle: -90
        offset: 0, 1
        quality: 2

      # 45 degrees left and right of reverse
      - angle: 135
        offset: 0.5, 0
        quality: 2
      - angle: -135
        offset: 0.5, 0
        quality: 2

      # directly reverse
      - angle: 180
        quality: 2
      - angle: 180
        quality: 2
        offset: 1, 0
    # Triad End
  - type: Sprite
    sprite: _Mono/Structures/Shuttles/thruster_large.rsi
    offset: 0.5,-0.5
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 2
  - type: DeviceNetwork # Mono
    deviceNetId: Wireless # Mono
    receiveFrequencyId: BasicDevice # Mono
  - type: WirelessNetworkConnection # Mono
    range: 200 # Mono
  - type: DeviceLinkSink # Mono
    ports: # Mono
    - On # Mono
    - Off # Mono
    - Toggle # Mono
  - type: Anchorable
    delay: 10
  - type: Rotatable
    rotateWhileAnchored: false
    increment: 90
  - type: StaticPrice
    price: 1500
  - type: RadarBlip
    visibleFromOtherGrids: true
    radarColor: "#99FF99"
    scale: 2
    shape: diamond
    gridConfig:
      color: "#99FF99"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-0.5,-1.5,1.5,0.5"
  - type: ShipRepairable
    repairTime: 15
    repairCost: 15

- type: entity
  parent: ThrusterLarge
  id: ThrusterLargePartsT2
  suffix: T2 Parts
  components:
  - type: Machine
    partOverrides:
      Capacitor: AdvancedCapacitorStockPart
