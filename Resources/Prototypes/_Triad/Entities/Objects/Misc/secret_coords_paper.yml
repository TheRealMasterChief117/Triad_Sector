# Base
- type: entity
  parent: MarkerBase
  id: SecretCoordinatesMarkerBase
  name: secret coordinate
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: blue
  - type: SecretCoordinatesEntity
    linkedId: Default

- type: entity
  id: PaperCoordinatesBase
  abstract: true
  components:
  - type: Tag
    tags:
    - Document
    - Paper
    - NFPaperStampProtected

# Solarian Republic Cache
- type: entity
  parent: SecretCoordinatesMarkerBase
  id: SecretCoordinatesMarkerSolarianDirectiveCache
  name: FSR cache secret coordinate marker
  components:
  - type: Sprite
    layers:
    - state: blue
    - sprite: _Mono/Objects/Weapons/Guns/Rifles/calico.rsi
      state: base
  - type: SecretCoordinatesEntity
    linkedId: FSRCache

- type: entity
  parent: [PaperSolarianRepublic, PaperCoordinatesBase]
  id: PaperCoordinatesSolarianDirectiveCache
  name: FSR ministry of defence notice
  description: A professional digital document with a biometric lock, used by the Federated Solarian Republic to sent out important classified messages.
  #categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: secret-coordinates-sol-directive-text # Default contents, will be edited.
    stampedBy:
    - stampedName: stamp-component-stamped-name-fsr-ministry-of-defence
      stampedColor: "#4c55d8"
    stampState: null
    destroyOnFax: true
    destroyMessage: fax-delete-paper-generic
  - type: SecretCoordinatesPaper
    linkedId: FSRCache
    bypassFactions: [SD] # SD members can just scan their fingerprints
    secretCoordinatePaperContent: secret-coordinates-sol-directive-text
